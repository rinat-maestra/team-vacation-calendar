<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Days Off Calendar</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --card-bg: #f8f9fb;
    --border: #e5e7eb;
    --weekend-bg: #f1f2f4;
    --today-ring: #111827;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --fg: #edeef0;
      --muted: #9aa0aa;
      --card-bg: #1c1f24;
      --border: #2a2e35;
      --weekend-bg: #22262d;
      --today-ring: #f5f5f5;
    }

  :root[data-theme="dark"] {
    --bg: #14161a;
    --fg: #edeef0;
    --muted: #9aa0aa;
    --card-bg: #1c1f24;
    --border: #2a2e35;
    --weekend-bg: #22262d;
    --today-ring: #f5f5f5;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px 16px 40px;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 4px;
    font-weight: 700;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin: 0 0 18px;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    padding: 12px 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    white-space: nowrap;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid rgba(128,128,128,0.35);
  }
  .months {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .month-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
  }
  .month-title {
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 8px;
    text-align: center;
  }
  .grid7 {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .dow {
    font-size: 0.65rem;
    color: var(--muted);
    text-align: center;
    padding-bottom: 2px;
    font-weight: 600;
  }
  .day {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 3px;
    font-size: 0.68rem;
    background: transparent;
  }
  .day.weekend { background: var(--weekend-bg); }
  .day.empty { visibility: hidden; }
  .day .num { color: var(--fg); opacity: 0.85; }
  .day.today .num {
    box-shadow: 0 0 0 1.5px var(--today-ring);
    border-radius: 50%;
    width: 1.5em;
    height: 1.5em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .dotrow {
    display: flex;
    gap: 2px;
    margin-top: 2px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 100%;
  }
  .dotrow .mini {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    border: 1px solid rgba(128,128,128,0.4);
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .header-row .legend { flex: 1; }
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .view-select {
    background: var(--card-bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.8rem;
    font-family: inherit;
    cursor: pointer;
  }
  .table-title {
    font-size: 1.05rem;
    margin: 32px 0 12px;
  }
  .status-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
    margin-bottom: 8px;
  }
  .status-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .status-name {
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: 700;
    font-size: 0.88rem;
    margin-bottom: 8px;
  }
  .status-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    padding: 2px 0;
  }
  .status-label { color: var(--muted); }
  .status-value { font-weight: 600; }
  .status-value.ongoing { color: #22c55e; }
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  thead th {
    text-align: left;
    padding: 10px 12px;
    background: var(--card-bg);
    color: var(--muted);
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody tr:last-child td { border-bottom: none; }
  .person-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .person-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid rgba(128,128,128,0.35);
  }
  .empty-note {
    color: var(--muted);
    font-size: 0.82rem;
    padding: 14px;
  }
  footer.updated {
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 28px;
    text-align: center;
  }
  @media (max-width: 480px) {
    .months { grid-template-columns: 1fr 1fr; }

</head>

// ---------- Date helpers ----------
function parseDate(s) {
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}
function toKey(d) {
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function countWeekdaysInYear(startStr, endStr, year) {
  const s = parseDate(startStr), e = parseDate(endStr);
  const yStart = new Date(year, 0, 1), yEnd = new Date(year, 11, 31);
  const clipStart = s < yStart ? yStart : s;
  const clipEnd = e > yEnd ? yEnd : e;
  if (clipStart > clipEnd) return 0;
  let n = 0;
  for (let d = new Date(clipStart); d <= clipEnd; d.setDate(d.getDate()+1)) {
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6) n++;
  }
  return n;
}

}

function addRangeToMap(map, start, end, color) {
  const s = parseDate(start), e = parseDate(end);
  for (let d = new Date(s); d <= e; d.setDate(d.getDate()+1)) {
    const key = toKey(d);
    if (!map[key]) map[key] = [];
    map[key].push(color);
  }
}

function buildDayMap(team, mode) {
  const map = {};
  const names = new Set(peopleInTeam(team));
  const includeCoverage = mode === "all" || mode === "allVacations" || mode === "coverage";
  const includeNoCoverage = mode === "all" || mode === "allVacations" || mode === "noCoverage";
  const includeNoVacations = mode === "all" || mode === "noVacations";
  ENTRIES.forEach(en => {
    if (!names.has(en.name)) return;
    if (en.tag === "coverage" && includeCoverage) addRangeToMap(map, en.start, en.end, en.color);
    else if (en.tag === "noCoverage" && includeNoCoverage) addRangeToMap(map, en.start, en.end, en.color);
    else if (en.tag === "noVacations" && includeNoVacations) addRangeToMap(map, en.start, en.end, NO_VACATIONS_COLOR);
  });
  return map;
}

function renderCalendar(team, year, mode) {
  const dayMap = buildDayMap(team, mode);
  const todayKey = toKey(TODAY);
  monthsEl.innerHTML = "";
  for (let mo = 0; mo < 12; mo++) {
    const card = document.createElement("div");
    card.className = "month-card";
    const title = document.createElement("div");
    title.className = "month-title";
    title.textContent = monthNames[mo] + " " + year;
    card.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "grid7";
    dowLabels.forEach(l => {
      const el = document.createElement("div");
      el.className = "dow";
      el.textContent = l;
      grid.appendChild(el);
    });

    const firstDay = new Date(year, mo, 1);
    const startOffset = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(year, mo+1, 0).getDate();

    for (let i=0; i<startOffset; i++) {
      const el = document.createElement("div");
      el.className = "day empty";
      grid.appendChild(el);
    }
    for (let d=1; d<=daysInMonth; d++) {
      const date = new Date(year, mo, d);
      const dow = date.getDay();
      const key = toKey(date);
      const el = document.createElement("div");
      el.className = "day" + ((dow===0||dow===6) ? " weekend" : "") + (key===todayKey ? " today" : "");
      const num = document.createElement("div");
      num.className = "num";
      num.textContent = d;
      el.appendChild(num);
      if (dayMap[key]) {
        const row = document.createElement("div");
        row.className = "dotrow";
        dayMap[key].forEach(c => {
          const dot = document.createElement("div");
          dot.className = "mini";
          dot.style.background = c;
          row.appendChild(dot);
        });
        el.appendChild(row);
      }
      grid.appendChild(el);
    }
    card.appendChild(grid);
    monthsEl.appendChild(card);
  }
}

function renderLegend(team) {
  legendEl.innerHTML = "";
  peopleInTeam(team).forEach(name => {
    const item = document.createElement("div");
    item.className = "legend-item";
    item.innerHTML = `<span class="dot" style="background:${PEOPLE[name].color}"></span>${name}`;
    legendEl.appendChild(item);
  });
  const nvItem = document.createElement("div");
  nvItem.className = "legend-item";
  nvItem.innerHTML = `<span class="dot" style="background:${NO_VACATIONS_COLOR}"></span>No Vacations`;
  legendEl.appendChild(nvItem);
}

function renderStatus(team, year) {
  statusGrid.innerHTML = "";
  peopleInTeam(team).forEach(name => {
    const personEntries = ENTRIES.filter(en => en.name === name && en.tag === "coverage");
    let lastEnd = null, nextStart = null, ongoingEnd = null;
    personEntries.forEach(en => {
      const sd = parseDate(en.start), ed = parseDate(en.end);
      if (sd <= TODAY && TODAY <= ed) { ongoingEnd = ed; }
      else if (ed < TODAY) { if (!lastEnd || ed > lastEnd) lastEnd = ed; }
      else if (sd > TODAY) { if (!nextStart || sd < nextStart) nextStart = sd; }
    });
    const totalThisYear = personEntries.reduce((sum, en) => sum + countWeekdaysInYear(en.start, en.end, year), 0);

    const card = document.createElement("div");
    card.className = "status-card";
    let html = `<div class="status-name"><span class="dot" style="background:${PEOPLE[name].color}"></span>${name}</div>`;
    if (ongoingEnd) {
      const daysLeft = daysBetween(TODAY, ongoingEnd);
      html += `<div class="status-row"><span class="status-label">Status</span><span class="status-value ongoing">On vacation (back in ${daysLeft}d)</span></div>`;
    }
    html += `<div class="status-row"><span class="status-label">Total ${year}</span><span class="status-value">${totalThisYear}d</span></div>`;
    html += `<div class="status-row"><span class="status-label">Last vacation</span><span class="status-value">${lastEnd ? daysBetween(lastEnd, TODAY) + "d ago" : "—"}</span></div>`;
    html += `<div class="status-row"><span class="status-label">Next planned</span><span class="status-value">${nextStart ? "in " + daysBetween(TODAY, nextStart) + "d" : "none planned"}</span></div>`;
    card.innerHTML = html;
    statusGrid.appendChild(card);
  });
}

function fillTable(tbody, rows) {
  tbody.innerHTML = "";
  if (rows.length === 0) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 3;
    td.className = "empty-note";
    td.textContent = "No entries for this selection.";
    tr.appendChild(td);
    tbody.appendChild(tr);
    return;
  }
  rows.sort((a,b) => parseDate(a.start) - parseDate(b.start));
  rows.forEach(en => {
    const tr = document.createElement("tr");
    const dateLabel = en.start === en.end ? fmt(en.start) : (fmt(en.start) + " → " + fmt(en.end));
    const wd = countWeekdaysInYear(en.start, en.end, en._year);
    tr.innerHTML = `
      <td><div class="person-cell"><span class="person-dot" style="background:${en.color}"></span>${en.name}</div></td>
      <td>${dateLabel}</td>
      <td>${wd}</td>
    `;
    tbody.appendChild(tr);
  });
}

function renderTables(team, year) {
  const names = new Set(peopleInTeam(team));
  const inYear = en => {
    const s = parseDate(en.start), e = parseDate(en.end);
    return s.getFullYear() === year || e.getFullYear() === year;
  };
  const withYear = arr => arr.map(en => Object.assign({}, en, { _year: year }));

  fillTable(vacBody, withYear(ENTRIES.filter(en => names.has(en.name) && en.tag === "coverage" && inYear(en))));
  fillTable(ncBody, withYear(ENTRIES.filter(en => names.has(en.name) && en.tag === "noCoverage" && inYear(en))));
  fillTable(nvBody, withYear(ENTRIES.filter(en => names.has(en.name) && en.tag === "noVacations" && inYear(en))));
}

function renderAll() {
  const team = teamSelect.value;
  const year = parseInt(yearSelect.value, 10);
  const mode = viewModeSelect.value;
  renderLegend(team);
  renderCalendar(team, year, mode);
  renderStatus(team, year);
  renderTables(team, year);
}

teamSelect.addEventListener("change", renderAll);
yearSelect.addEventListener("change", renderAll);
viewModeSelect.addEventListener("change", renderAll);

(function initYear() {
  const currentYear = TODAY.getFullYear();
  const opt = yearSelect.querySelector(`option[value="${currentYear}"]`);
  if (opt) opt.selected = true;
})();

renderAll();
</script>
</body>
</html>
